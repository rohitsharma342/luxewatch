name: luxe_watch
description: A premium platform for buying and selling luxury watches.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  provider: ^6.1.1
  cached_network_image: ^3.3.1
  cached_network_image_web: ^1.1.0
  google_fonts: ^6.1.0
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  flutter_cache_manager: ^3.3.1
  crypto: ^3.0.3
  path_provider: ^2.1.1
  path_provider_platform_interface: ^2.1.1
  path_provider_web: ^2.2.0
  path: ^1.8.3
  http: ^1.1.0
  file: ^7.0.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  sqflite_common_ffi_web: ^0.4.0+1
  uuid: ^4.2.1
  ffi: ^2.1.0
  flutter_keyboard_visibility: ^6.0.0
  flutter_keyboard_visibility_web: ^2.0.0
  shared_preferences: ^2.2.2
  shared_preferences_web: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
